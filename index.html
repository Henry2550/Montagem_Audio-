<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Controle de Estoque</h1>

<div class="menu">
    <button onclick="mostrar('blocos')">Blocos</button>
    <button onclick="mostrar('salas')">Salas</button>
    <button onclick="mostrar('equipamentos')">Equipamentos</button>
</div>

<div id="blocos">
    <h2>Cadastrar Bloco</h2>
    <input type="text" id="nomeBloco" placeholder="Ex: Bloco 1">
    <button onclick="adicionarBloco()">Salvar</button>
    <ul id="listaBlocos"></ul>
    
    <h2>Cadastrar Sala</h2>

<select id="blocoSala"></select>

<input
    type="text"
    id="nomeSala"
    placeholder="Ex: 101"
/>

<button onclick="adicionarSala()">
    Salvar Sala
</button>
</div>
<div id="equipamentos" style="display:none;">

    <h2>Cadastrar Equipamento</h2>

    <input
        type="text"
        id="nomeEquipamento"
        placeholder="Ex: Notebook 01"
    >

    <button onclick="adicionarEquipamento()">
        Salvar
    </button>

    <ul id="listaEquipamentos"></ul>

</div>
<script src="script.js"></script>

</body>
</html>
